name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴私人笔记、令牌、Cookie 或客户资料。
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 0.7.2
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian 与系统版本
      placeholder: Obsidian 1.x / macOS 15.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
